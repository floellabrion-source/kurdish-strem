server {
    listen 80;
    server_name 77.42.22.139 kstfilm.com www.kstfilm.com _;

    root /var/www/kurdish-stream/client/dist;
    index index.html;

    client_max_body_size 5000M;
    client_body_timeout 1800s;
    client_header_timeout 1800s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Long-term Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # Social Media Bots (Telegram, WhatsApp, Facebook, Twitter, Viber, Discord) OpenGraph Routing
    set $is_social_bot 0;
    if ($http_user_agent ~* "telegrambot|whatsapp|facebookexternalhit|twitterbot|discordbot|skypeuripreview|linkedinbot|viber|slackbot|applebot") {
        set $is_social_bot 1;
    }

    location ~ ^/(movie|series|watch)/ {
        if ($is_social_bot = 1) {
            proxy_pass http://127.0.0.1:3001;
            break;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 1800s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 1800s;
    }
}
